
<section class="hero">
    
    <div class="hero-content">
        <h1 class="highlight">Flexible & Accessible</h1>
        <h2>Master new skills with our top-rated online courses, anytime, anywhere.</h2>

        <div class="hero-buttons">
            <a routerLink="/signup" class="primary-btn">Get Started</a>
            <a routerLink="/courses" class="secondary-btn">Explore Courses</a>
        </div>
    </div>

</section>

<section class="popular-courses">
    <div class="carousel-header">
        <h1>Popular Courses</h1>
    </div>

    <div class="course-carousel">
        <button type="button" class="carousel-btn" aria-label="Show previous course" (click)="scrollToRelativeCard(-1)">←</button>

        <div class="course-track" #track>
            <article
                #courseCard
                class="course-card"
                *ngFor="let course of popularCourses; let i = index"
                (click)="scrollToCard(i)"
                [style.background-color]="course.color"
            >
                <img [src]="course.imageUrl" [alt]="course.title">
                <div class="course-body">
                    <h2>{{ course.title }}</h2>
                    <p>{{ course.description }}</p>
                </div>
            </article>
        </div>

        <button type="button" class="carousel-btn" aria-label="Show next course" (click)="scrollToRelativeCard(1)">→</button>
    </div>
</section>

<app-footer></app-footer>
